name: Laya decision integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checkpoint-postprocessing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Compare with pinned checkpoint post-processing
        run: cargo +1.100.0 test --locked --test postprocessing_integration
      - name: Compare question sequences with upstream rendering
        run: cargo +1.100.0 test --locked --test sequence_integration
